name: Stock Screener IDX (online)

on:
  schedule:
    # 09:10 WIB = 02:10 UTC — early open
    - cron: "10 2 * * 1-5"
    # 12:05 WIB = 05:05 UTC — break sesi 1
    - cron: "5 5 * * 1-5"
    # 16:20 WIB = 09:20 UTC — EOD confirmed
    - cron: "20 9 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of:
        description: "kosong / kemarin / YYYY-MM-DD / 20 july"
        required: false
        default: ""
      mode:
        description: "eod | open | midday | morning"
        required: false
        default: "eod"

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env from secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          {
            echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
            echo "TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}"
            echo "WHATSAPP_PHONE=${WHATSAPP_PHONE}"
            echo "CALLMEBOT_APIKEY=${CALLMEBOT_APIKEY}"
          } > .env

      - name: Resolve mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "${INPUT_MODE}" ]; then
            MODE="${INPUT_MODE}"
          else
            case "${SCHEDULE}" in
              "10 2 * * 1-5") MODE="open" ;;
              "5 5 * * 1-5") MODE="midday" ;;
              *) MODE="eod" ;;
            esac
          fi
          echo "MODE=${MODE}" >> "$GITHUB_ENV"
          echo "Resolved MODE=${MODE} (schedule='${SCHEDULE}')"

      - name: Run screener
        env:
          AS_OF: ${{ github.event.inputs.as_of }}
        run: |
          ARGS=(--mode "${MODE}" --no-whatsapp)
          if [ -n "${AS_OF}" ]; then
            ARGS+=(--as-of "${AS_OF}")
          fi
          python run_screener.py "${ARGS[@]}"

      - name: Upload JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-output-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
